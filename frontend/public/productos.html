<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos — Car Solution</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/store.css">
</head>
<body class="store-body">

<nav>
  <div class="nav-marca">
    Car Solution
    <small>Tienda de insumos</small>
  </div>
  <ul class="nav-links">
    <li><a href="/">Inicio</a></li>
    <li>
      <a href="/productos" class="nav-chip nav-chip-active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 016 0"/></svg>
        <span class="nav-chip-label">Productos</span>
      </a>
    </li>
    <li>
      <a href="/carrito" class="nav-chip nav-chip-cart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/><path d="M3 4h2l2.4 11h9.2L20 8H7"/></svg>
        <span class="nav-chip-label">Carrito</span>
        <span class="cart-badge hidden" data-cart-count></span>
      </a>
    </li>
    <li id="navAuthSlot"></li>
  </ul>
</nav>

<section class="store-hero">
  <div>
    <div class="seccion-label">Tienda</div>
    <h1>Productos para tu auto</h1>
    <p>Marcas disponibles en México. Agrega al carrito y finaliza la compra cuando quieras.</p>
  </div>
  <a href="/carrito" class="btn-hero" style="text-decoration:none;">Ver carrito</a>
</section>

<section class="store-catalog">
  <div id="productsGrid" class="products-grid">
    <p style="color:var(--gris);">Cargando productos...</p>
  </div>
</section>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/productos.js"></script>
</body>
</html>
